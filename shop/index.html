<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop — Project SiXXX</title>
  <meta name="description" content="Horns &amp; Halos shop. Release 001 black tees $35." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root { --void:#050505; --bone:#e8dcc8; --mute:rgba(232,220,200,.62); --crimson:#9b1c1c; --gold:#c9a96e; --line:rgba(232,220,200,.14); }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { background:var(--void); color:var(--bone); font-family:"Cormorant Garamond",Georgia,serif; min-height:100svh; }
    a { color:inherit; text-decoration:none; }
    .chrome { display:flex; align-items:center; justify-content:space-between; padding:1rem 5vw; border-bottom:1px solid var(--line); font-family:"IBM Plex Sans",system-ui,sans-serif; font-size:.72rem; letter-spacing:.18em; text-transform:uppercase; color:var(--mute); }
    .chrome .brand { color:var(--bone); font-weight:500; }
    .chrome nav { display:flex; gap:1.4rem; }
    main { max-width:720px; margin:0 auto; padding:4.5rem 1.4rem 5rem; text-align:center; }
    .kicker { font-family:"IBM Plex Sans",system-ui,sans-serif; font-size:.68rem; letter-spacing:.28em; text-transform:uppercase; color:var(--gold); }
    h1 { font-weight:600; font-size:clamp(2rem,5vw,3rem); letter-spacing:.05em; margin:1rem 0 1.2rem; }
    p { color:var(--mute); font-size:1.15rem; max-width:34rem; margin:0 auto 1.2rem; line-height:1.6; }
    .price { font-family:"IBM Plex Sans",system-ui,sans-serif; color:var(--bone); letter-spacing:.12em; text-transform:uppercase; font-size:.85rem; margin:1.5rem 0; }
    .btn { display:inline-block; margin:.35rem; padding:.9rem 1.5rem; border:1px solid var(--crimson); color:var(--bone); font-family:"IBM Plex Sans",system-ui,sans-serif; font-size:.72rem; letter-spacing:.16em; text-transform:uppercase; background:rgba(155,28,28,.28); }
    .btn:hover { background:rgba(155,28,28,.45); }
    .btn.ghost { background:transparent; border-color:var(--line); }
    .seal { width:64px; height:auto; margin:1.2rem auto; display:block; opacity:.9; }
  </style>
</head>
<body>
  <header class="chrome">
    <a class="brand" href="/">Project SiXXX</a>
    <nav>
      <a href="/">Home</a>
      <a href="/shop/">Shop</a>
      <a href="https://hornshalosshop.myshopify.com/" rel="noopener">Shopify</a>
    </nav>
  </header>
  <main>
    <p class="kicker">The house shop</p>
    <img class="seal" src="/assets/wax-seal-6.svg" width="180" height="180" alt="Wax seal 6" />
    <h1>Horns &amp; Halos</h1>
    <p>Release 001 black tees — full 6 — locked at $35 USD. Shop is open — enter when ready.</p>
    <p class="price">R001 · $35 USD</p>
    <a class="btn" href="https://hornshalosshop.myshopify.com/" rel="noopener">Open Shopify</a>
    <a class="btn ghost" href="/">Return home</a>
  </main>
</body>
</html>
