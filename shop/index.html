<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{--void:#050505;--obsidian:#0B0B0C;--bone:#e8dcc8;--mute:rgba(232,220,200,.62);--ash:#8A8494;--crimson:#9b1c1c;--gold:#c9a96e;--silver:#c8d0d8;--line:rgba(232,220,200,.14);--hairline:rgba(232,220,200,.14);--ink:#0B0B0C;--font-ui:"IBM Plex Sans",system-ui,sans-serif;--label:.6875rem;--track-label:.18em;--ease-out:cubic-bezier(.16,1,.3,1);--t-fast:400ms}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--void);color:var(--bone);font-family:"Cormorant Garamond",Georgia,serif;min-height:100svh;line-height:1.55}a{color:inherit;text-decoration:none}.chrome{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1rem 5vw;border-bottom:1px solid var(--line);font-family:var(--font-ui);font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);position:sticky;top:0;z-index:25;background:color-mix(in srgb,var(--void) 88%,transparent);backdrop-filter:blur(10px)}.chrome .brand{color:var(--bone);font-weight:500}
.primary-nav{position:relative;display:flex;align-items:center;justify-content:flex-end;gap:.75rem;min-width:0}
.nav--chrome{display:flex;align-items:center;flex-wrap:wrap;gap:.85rem 1.25rem}
.nav--chrome a:hover{color:var(--bone)}
.nav-trigger{display:none;align-items:center;justify-content:center;padding:.45rem .85rem;font-family:var(--font-ui);font-size:var(--label);font-weight:500;letter-spacing:var(--track-label);text-transform:uppercase;color:var(--ash);border:1px solid var(--hairline);background:color-mix(in srgb,var(--obsidian) 70%,transparent);box-shadow:inset 0 1px 0 color-mix(in srgb,var(--bone) 8%,transparent);cursor:pointer;transition:color var(--t-fast) var(--ease-out),border-color var(--t-fast) var(--ease-out),background-color var(--t-fast) var(--ease-out)}
.nav-trigger:hover,.nav-trigger[aria-expanded="true"]{color:var(--bone);border-color:color-mix(in srgb,var(--crimson) 55%,var(--hairline))}
.nav-backdrop{display:none;position:fixed;top:4.35rem;right:0;bottom:0;left:0;z-index:45;margin:0;padding:0;border:0;background:rgba(5,5,5,.55);cursor:pointer;-webkit-appearance:none;appearance:none}
.nav-backdrop.is-open{display:block}

.nav-parchment{position:absolute;top:calc(100% + .55rem);right:0;left:auto;z-index:30;width:max-content;min-width:16rem;max-width:min(22rem,calc(100vw - 1.5rem));box-sizing:border-box;padding:0;max-height:0;opacity:0;overflow:hidden;pointer-events:none;transform:translateY(-6px);background:rgba(232,226,214,.92);color:var(--obsidian);border:1px solid color-mix(in srgb,var(--crimson) 45%,var(--silver));box-shadow:inset 0 1px 0 color-mix(in srgb,var(--bone) 35%,transparent),0 12px 28px color-mix(in srgb,var(--void) 55%,transparent);transition:max-height 400ms var(--ease-out),opacity 400ms var(--ease-out),transform 400ms var(--ease-out),padding 400ms var(--ease-out)}
.nav-parchment.is-open{max-height:28rem;opacity:1;pointer-events:auto;transform:translateY(0);padding:1.15rem 1.2rem 1.25rem}
.nav-parchment::before,.nav-parchment::after,.nav-parchment__filigree::before,.nav-parchment__filigree::after{content:"";position:absolute;width:1.65rem;height:1.65rem;pointer-events:none;border-style:solid;border-color:color-mix(in srgb,var(--crimson) 55%,var(--silver));opacity:.9;z-index:1}
.nav-parchment::before{top:.4rem;left:.4rem;border-width:1px 0 0 1px;border-radius:.35rem 0 0 0}
.nav-parchment::after{top:.4rem;right:.4rem;border-width:1px 1px 0 0;border-radius:0 .35rem 0 0}
.nav-parchment__filigree{position:absolute;inset:0;pointer-events:none}
.nav-parchment__filigree::before{bottom:.4rem;left:.4rem;top:auto;right:auto;border-width:0 0 1px 1px;border-radius:0 0 0 .35rem}
.nav-parchment__filigree::after{bottom:.4rem;right:.4rem;top:auto;left:auto;border-width:0 1px 1px 0;border-radius:0 0 .35rem 0}
.nav-parchment__list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.15rem}
.nav-parchment__list a{position:relative;display:block;white-space:nowrap;padding:.55rem .75rem .55rem .85rem;font-family:var(--font-ui);font-size:var(--label);font-weight:500;letter-spacing:var(--track-label);text-transform:uppercase;color:var(--obsidian);transition:color var(--t-fast) var(--ease-out),transform var(--t-fast) var(--ease-out),padding-left var(--t-fast) var(--ease-out),box-shadow var(--t-fast) var(--ease-out)}
.nav-parchment__list a::before{content:"";position:absolute;left:0;top:.35rem;bottom:.35rem;width:2px;background:transparent;transition:background var(--t-fast) var(--ease-out)}
.nav-parchment__list a:hover,.nav-parchment__list a:focus-visible{color:var(--ink);transform:translateY(-1px);padding-left:1rem;outline:none}
.nav-parchment__list a:hover::before,.nav-parchment__list a:focus-visible::before{background:var(--crimson)}
.nav-parchment__list a[aria-current="page"]{color:var(--ink);box-shadow:inset 0 -1px 0 color-mix(in srgb,var(--crimson) 55%,transparent)}
.nav-parchment__list a[aria-current="page"]::before{background:var(--crimson)}
@media (max-width:800px){.nav--chrome{display:none}.nav-trigger{display:inline-flex}.primary-nav{justify-content:flex-end}.nav-parchment{position:fixed;top:4.35rem;left:16px;right:16px;width:auto;min-width:0;max-width:none;margin:0;box-sizing:border-box;z-index:50;transform:translateY(-6px)}.nav-parchment.is-open{padding:1.15rem max(1rem,16px) 1.25rem;transform:translateY(0)}.nav-parchment__list a{white-space:normal}}

main{max-width:720px;margin:0 auto;padding:4.5rem 1.4rem 5rem;text-align:center}.kicker{font-family:var(--font-ui);font-size:.68rem;letter-spacing:.28em;text-transform:uppercase;color:var(--gold)}h1{font-weight:600;font-size:clamp(2rem,5vw,3rem);letter-spacing:.05em;margin:1rem 0 1.2rem}p{color:var(--mute);font-size:1.15rem;max-width:34rem;margin:0 auto 1.2rem;line-height:1.6}.price{font-family:var(--font-ui);color:var(--bone);letter-spacing:.12em;text-transform:uppercase;font-size:.85rem;margin:1.5rem 0}.btn{display:inline-block;margin:.35rem;padding:.9rem 1.5rem;border:1px solid var(--crimson);color:var(--bone);font-family:var(--font-ui);font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;background:rgba(155,28,28,.28)}.btn:hover{background:rgba(155,28,28,.45)}.btn.ghost{background:transparent;border-color:var(--line)}.seal{width:64px;height:auto;margin:1.2rem auto;display:block;opacity:.9}
</style>
</head>
<body>
<header class="chrome">
<a class="brand" href="../">Project SiXXX</a>
<nav class="primary-nav" aria-label="Primary" id="primary-nav">
<div class="nav nav--primary nav--chrome">
<a href="../">Home</a>

</div>

<li><a href="./" aria-current="page">Shop</a></li>

</ul>
</div>
</nav>
</header>

<main>
<p class="kicker">The house shop</p>

<h1>Horns &amp; Halos</h1>

<p class="price">R001 · $35 USD</p>
<a class="btn" href="https://hornshalosshop.myshopify.com/" rel="noopener">Open Shopify</a>

</main>
<script>(function(){var root=document.getElementById("primary-nav"),trigger=document.getElementById("nav-trigger"),panel=document.getElementById("nav-parchment-panel"),header=document.querySelector("header.chrome"),mq=window.matchMedia("(max-width:800px)");if(!root||!trigger||!panel)return;var backdrop=document.getElementById("nav-backdrop");if(!backdrop){backdrop=document.createElement("button");backdrop.type="button";backdrop.className="nav-backdrop";backdrop.id="nav-backdrop";backdrop.setAttribute("aria-hidden","true");backdrop.tabIndex=-1;document.body.appendChild(backdrop)}function isMobile(){return mq.matches}function syncTop(){if(isMobile()&&header){var headerBottom=header.getBoundingClientRect().bottom;panel.style.top=(headerBottom+8)+"px";if(backdrop.classList.contains("is-open"))backdrop.style.top=headerBottom+"px"}else{panel.style.removeProperty("top");backdrop.style.removeProperty("top")}}function placePanel(){if(isMobile()){if(panel.parentNode!==document.body)document.body.appendChild(panel);syncTop()}else{syncTop();if(panel.parentNode!==root)root.appendChild(panel);setOpen(false)}}function setOpen(o){if(!isMobile())o=false;panel.classList.toggle("is-open",!!o);panel.setAttribute("aria-hidden",o?"false":"true");trigger.setAttribute("aria-expanded",o?"true":"false");trigger.textContent=o?"Close":"Menu";var showBack=!!(o&&isMobile());backdrop.classList.toggle("is-open",showBack);backdrop.setAttribute("aria-hidden",showBack?"false":"true");document.body.classList.toggle("nav-open",!!(o&&isMobile()));if(showBack){syncTop();if(header)backdrop.style.top=header.getBoundingClientRect().bottom+"px"}else{backdrop.style.removeProperty("top");document.body.classList.remove("nav-open")}}function close(){setOpen(false)}placePanel();if(mq.addEventListener){mq.addEventListener("change",placePanel)}else if(mq.addListener){mq.addListener(placePanel)}window.addEventListener("resize",function(){if(isMobile()){syncTop();if(panel.parentNode!==document.body)document.body.appendChild(panel)}else{placePanel()}});trigger.addEventListener("click",function(){setOpen(!panel.classList.contains("is-open"))});backdrop.addEventListener("click",close);document.addEventListener("keydown",function(e){if(e.key==="Escape")close()});document.addEventListener("pointerdown",function(e){var t=e.target;if(!(t instanceof Node))return;if(root.contains(t)||panel.contains(t)||backdrop===t||backdrop.contains(t))return;close()});panel.querySelectorAll("a").forEach(function(a){a.addEventListener("click",close)})})();</script>
</body>
